<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="avatarClip"><circle cx="450" cy="205" r="116"/></clipPath>
  </defs>

  <rect x="8" y="8" width="884" height="414" rx="34" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- floating 3D chunks -->
  <g filter="url(#glow)" opacity=".95">
    <g>
      <rect x="82" y="76" width="74" height="74" rx="18" fill="#164e63" stroke="#22d3ee" transform="rotate(-12 119 113)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="119" y="121" text-anchor="middle" fill="#cffafe" font-size="28" font-family="Arial">AI</text>
    </g>
    <g>
      <rect x="716" y="70" width="82" height="82" rx="20" fill="#312e81" stroke="#818cf8" transform="rotate(14 757 111)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 16;0 0" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="757" y="120" text-anchor="middle" fill="#e0e7ff" font-size="25" font-family="Arial">ML</text>
    </g>
    <g>
      <rect x="88" y="286" width="92" height="58" rx="16" fill="#1e293b" stroke="#38bdf8" transform="rotate(8 134 315)">
        <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="5.2s" repeatCount="indefinite"/>
      </rect>
      <text x="134" y="322" text-anchor="middle" fill="#bae6fd" font-size="20" font-family="Arial">CODE</text>
    </g>
    <g>
      <rect x="715" y="286" width="98" height="58" rx="16" fill="#1e1b4b" stroke="#a5b4fc" transform="rotate(-8 764 315)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-10 0;0 0" dur="5.6s" repeatCount="indefinite"/>
      </rect>
      <text x="764" y="322" text-anchor="middle" fill="#c7d2fe" font-size="20" font-family="Arial">BUILD</text>
    </g>
  </g>

  <!-- rotating rings -->
  <g transform="translate(450 205)" fill="none" stroke="url(#ring)" filter="url(#glow)">
    <circle r="132" stroke-width="3" stroke-dasharray="18 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="148" stroke-width="2" stroke-dasharray="5 22" opacity=".7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- GitHub avatar used as the profile photo -->
  <circle cx="450" cy="205" r="120" fill="#020617" stroke="#22d3ee" stroke-width="5"/>
  <image href="https://github.com/damr-web.png?size=500" x="334" y="89" width="232" height="232" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>

  <!-- foreground glass chunks -->
  <g opacity=".9">
    <path d="M278 365 L326 340 L360 362 L330 391 L286 389 Z" fill="#0e7490" opacity=".65">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M540 354 L586 336 L622 360 L596 390 L550 381 Z" fill="#3730a3" opacity=".65">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="450" y="390" text-anchor="middle" fill="#e0f2fe" font-size="22" font-family="Arial, sans-serif" font-weight="700">DARSHAN M NAIK  •  CSE  •  AI/ML  •  FULL STACK</text>
</svg>